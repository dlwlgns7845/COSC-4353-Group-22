<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Join Queue</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "stylesheet" href = "user_style.css">
    </head>

    <body>
        <div class="navbar" id="navbar"></div>

        <h1>Join Queue</h1>

        <div class = "container">
            <div class = "card">
                <h2>Select a Service</h2>

                <!-- novalidate turns off the browser pop-up so we can
                     show our own red message under the dropdown -->
                <form id="joinForm" novalidate>
                    <select id="service">
                        <option value="">Choose a Service</option>
                    </select>
                    <p class="error" id="serviceError">Please choose a service.</p>

                    <p id="currentQueue"></p>

                    <button type="submit" id="joinButton">Join Queue</button>
                    <button type="button" class="red" id="leaveButton">Leave Queue</button>
                </form>
            </div>

            <div class = "card">
                <h2>View estimated wait time</h2>

                <p id="serviceDescription"></p>
                <p>EWT: <strong id="waitTime">-</strong></p>
                <p>People waiting: <strong id="waitingCount">-</strong></p>
                <p>Minutes per person: <strong id="duration">-</strong></p>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="nav.js"></script>
        
<script>
    renderNav("join", "user");

    const API_URL = "http://localhost:3000/api";

    let services = [];
    let queue = [];

    // Send requests to the backend.
    async function apiRequest(path, options = {}) {
        const response = await fetch(API_URL + path, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Request failed.");
        }

        return data;
    }

    // Load services and queue entries from the backend.
    async function loadData() {
        try {
            services = await apiRequest("/services");
            queue = await apiRequest("/queue");

            fillServices();
            showWaitTime();
            showCurrentQueue();
        } catch (error) {
            console.error(error);
            document.getElementById("serviceDescription").textContent =
                "Could not load services. Please try again.";
        }
    }

    // Populate the dropdown using real backend service IDs.
    function fillServices() {
        const select = document.getElementById("service");
        select.innerHTML = '<option value="">Choose a Service</option>';

        services.forEach(function (service) {
            // The backend service list does not currently provide an "open" field.
            const option = document.createElement("option");
            option.value = service.id;
            option.textContent =
                service.name + " (" + service.priority + " priority)";
            select.appendChild(option);
        });

        if (select.options.length > 1) {
            select.selectedIndex = 1;
        }
    }

    function getSelectedService() {
        const serviceId = Number(document.getElementById("service").value);
        return services.find(function (service) {
            return service.id === serviceId;
        });
    }

    function showWaitTime() {
        const service = getSelectedService();

        if (!service) {
            document.getElementById("waitTime").textContent = "-";
            document.getElementById("waitingCount").textContent = "-";
            document.getElementById("duration").textContent = "-";
            document.getElementById("serviceDescription").textContent = "";
            return;
        }

        const waiting = queue.filter(function (entry) {
            return Number(entry.serviceId) === Number(service.id) &&
                   entry.status === "waiting";
        }).length;

        document.getElementById("serviceDescription").textContent =
            service.description;
        document.getElementById("waitingCount").textContent = waiting;
        document.getElementById("duration").textContent = service.duration;

        // Simple estimate: people ahead multiplied by service duration.
        document.getElementById("waitTime").textContent =
            (waiting * service.duration) + " minutes";
    }

    function showCurrentQueue() {
        const myEntry = queue.find(function (entry) {
            return entry.userName === CURRENT_USER.name &&
                   entry.status === "waiting";
        });

        const message = document.getElementById("currentQueue");

        if (!myEntry) {
            message.textContent = "";
            document.getElementById("joinButton").textContent = "Join Queue";
            return;
        }

        const service = services.find(function (item) {
            return Number(item.id) === Number(myEntry.serviceId);
        });

        message.textContent = service
            ? "You are waiting for " + service.name +
              " since " + new Date(myEntry.joinedAt).toLocaleTimeString()
            : "You are currently waiting in a queue.";

        document.getElementById("joinButton").textContent = "Switch Queue";
    }

    // Join the selected service through the backend API.
    async function joinQueue(serviceId) {
        const button = document.getElementById("joinButton");
        button.disabled = true;

        try {
            // Find any existing queue entry for this user.
            const existingEntry = queue.find(function (entry) {
                return entry.userName === CURRENT_USER.name &&
                       entry.status === "waiting";
            });

            // Leave the previous queue before switching.
            if (existingEntry) {
                await apiRequest("/queue/" + existingEntry.id, {
                    method: "DELETE"
                });
            }

            await apiRequest("/queue", {
                method: "POST",
                body: JSON.stringify({
                    serviceId: serviceId,
                    userName: CURRENT_USER.name,
                    priority: "medium"
                })
            });

            addNotification(
                "You joined the queue for " +
                getSelectedService().name + ".",
                "queue",
                "Queue joined"
            );

            window.location.href = "queue_status.html";
        } catch (error) {
            alert("Could not join the queue: " + error.message);
            await loadData();
        } finally {
            button.disabled = false;
        }
    }

    // Leave the queue through the backend API.
    async function leaveQueue() {
        try {
            const myEntry = queue.find(function (entry) {
                return entry.userName === CURRENT_USER.name &&
                       entry.status === "waiting";
            });

            if (!myEntry) {
                alert("You are not in a queue right now.");
                return;
            }

            await apiRequest("/queue/" + myEntry.id, {
                method: "DELETE"
            });

            addNotification(
                "You left the queue.",
                "queue",
                "Queue left"
            );

            await loadData();
        } catch (error) {
            alert("Could not leave the queue: " + error.message);
        }
    }

    // Validate the form before joining.
    document.getElementById("joinForm").addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            const serviceId =
                Number(document.getElementById("service").value);
            const error = document.getElementById("serviceError");

            if (!serviceId) {
                error.style.display = "block";
                return;
            }

            error.style.display = "none";
            await joinQueue(serviceId);
        }
    );

    document.getElementById("service").addEventListener(
        "change",
        showWaitTime
    );

    document.getElementById("leaveButton").addEventListener(
        "click",
        leaveQueue
    );

    // Start the page.
    loadData();
</script>

    </body>
</html>
