<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Queue Status</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "stylesheet" href = "user_style.css">
    </head>

    <body>
        <div class="navbar" id="navbar"></div>

        <h1 id="serviceTitle">Queue Status</h1>

        <div class = "container">
            <div class = "card">
                <h2>Current position in Queue</h2>

                <p>Position:</p>
                <div class="big-number" id="position">-</div>
            </div>

            <div class = "card">
                <h2>Estimated Wait Time</h2>

                <p>EWT:</p>
                <div class="big-number" id="waitTime">-</div>
            </div>

            <div class = "card">
                <h2>Status Update</h2>

                <p id="statusText">Waiting</p>
                <p><span class="badge waiting" id="statusBadge">Waiting</span></p>
                <button class="red" id="leaveButton">Leave Queue</button>
            </div>
        </div>

        <div class = "container">
            <div class = "card wide">
                <h2>People in this queue</h2>
                <table>
                    <thead>
                        <tr><th>#</th><th>Name</th><th>Joined</th><th>Status</th></tr>
                    </thead>
                    <tbody id="queueRows"></tbody>
                </table>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="nav.js"></script>
        <script>
            renderNav("status", "user");

            /* the three status values the assignment asks for */
            const STATUS_TEXT = {
                "waiting":      "Waiting",
                "almost-ready": "Almost ready",
                "served":       "Served"
            };

            function showStatus() {
                const myEntry = getMyEntry();

                /* not in a queue: show empty values and hide the leave button */
                if (!myEntry) {
                    document.getElementById("position").textContent = "-";
                    document.getElementById("waitTime").textContent = "-";
                    document.getElementById("statusText").textContent = "You are not in a queue.";
                    document.getElementById("statusBadge").style.display = "none";
                    document.getElementById("leaveButton").style.display = "none";
                    document.getElementById("queueRows").innerHTML =
                        '<tr><td colspan="4" class="empty">Nothing to show.</td></tr>';
                    return;
                }

                const service = findService(myEntry.serviceId);
                const line = getQueueForService(myEntry.serviceId);
                const position = line.findIndex(function (e) { return e.id === myEntry.id; }) + 1;

                document.getElementById("serviceTitle").textContent = service.name;
                document.getElementById("position").textContent = position;
                document.getElementById("waitTime").textContent =
                    estimateWait(myEntry.serviceId, position - 1) + " min";

                const badge = document.getElementById("statusBadge");
                badge.textContent = STATUS_TEXT[myEntry.status];
                badge.className = "badge " + myEntry.status;
                document.getElementById("statusText").textContent = "You joined at " + myEntry.joinedAt + ".";

                /* the whole line, so the user can see who is in front */
                let html = "";
                line.forEach(function (entry, index) {
                    const isMe = (entry.userName === CURRENT_USER.name);
                    const name = isMe ? "<strong>" + entry.userName + " (you)</strong>" : entry.userName;

                    html += "<tr>" +
                              "<td>" + (index + 1) + "</td>" +
                              "<td>" + name + "</td>" +
                              "<td>" + entry.joinedAt + "</td>" +
                              '<td><span class="badge ' + entry.status + '">' +
                                STATUS_TEXT[entry.status] + "</span></td>" +
                            "</tr>";
                });
                document.getElementById("queueRows").innerHTML = html;
            }

            document.getElementById("leaveButton").addEventListener("click", function () {
                const myEntry = getMyEntry();
                if (!myEntry) { return; }

                const service = findService(myEntry.serviceId);
                setQueue(getQueue().filter(function (e) { return e.id !== myEntry.id; }));
                addNotification("You left the queue for " + service.name + ".", "queue", "Queue left");
                location.reload();
            });

            showStatus();
        </script>
    </body>
</html>
