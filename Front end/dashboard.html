
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="user_style.css">
</head>

<body>
    <div class="navbar" id="navbar"></div>

    <h1>My Dashboard</h1>

    <div class="container">
        <div class="card">
            <h2>Queue Status</h2>

            <p>Position: <strong id="position">-</strong></p>
            <p>Wait time: <strong id="waitTime">-</strong></p>
            <p id="serviceName"></p>

            <a class="button" href="queue_status.html">
                Queue Status
            </a>
        </div>

        <div class="card">
            <h2>Active Services Available</h2>

            <div id="serviceList"></div>

            <a class="button" href="join_queue.html">
                Join Queue
            </a>
        </div>

        <div class="card">
            <h2>Notification Summary</h2>

            <p id="notificationCount">
                Loading notifications...
            </p>

            <div id="notificationList"></div>

            <a class="button" href="history.html">
                History
            </a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="nav.js"></script>

    <script>
        renderNav("dashboard", "user");

        const DASHBOARD_API_URL =
            "http://localhost:3000/api";

        let dashboardIsLoading = false;

        // Request data from the backend.
        async function dashboardRequest(path) {
            const response = await fetch(
                DASHBOARD_API_URL + path,
                { cache: "no-store" }
            );

            const data = await response.json()
                .catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    `API request failed (${response.status})`
                );
            }

            return data;
        }

        // Find the current user's active queue entry.
        function findCurrentEntry(entries) {
            const savedId = Number(
                localStorage.getItem(
                    "queuesmart_activeEntryId"
                )
            );

            const activeEntries = entries.filter(entry =>
                entry.status === "waiting" &&
                entry.userName === CURRENT_USER.name
            );

            return activeEntries.find(
                entry => entry.id === savedId
            ) || activeEntries[0];
        }

        // CARD 2: Display real backend services.
        function showServicesFromBackend(services, entries) {
            const box = document.getElementById(
                "serviceList"
            );

            box.replaceChildren();

            const availableServices = services.filter(
                service => service.open !== false
            );

            if (availableServices.length === 0) {
                box.textContent = "No services available.";
                return;
            }

            for (const service of availableServices) {
                const count = entries.filter(entry =>
                    Number(entry.serviceId) === Number(service.id) &&
                    entry.status === "waiting"
                ).length;

                const p = document.createElement("p");

                p.append(
                    document.createTextNode(service.name + " ")
                );

                const badge = document.createElement("span");

                const priority = ["high", "medium", "low"]
                    .includes(service.priority)
                    ? service.priority
                    : "medium";

                badge.className = "badge " + priority;
                badge.textContent = priority;

                p.append(
                    badge,
                    document.createElement("br")
                );

                const detail = document.createElement("small");
                detail.textContent = `${count} waiting`;

                p.appendChild(detail);
                box.appendChild(p);
            }
        }

        // CARD 1: Display no active queue.
        function showNoQueue() {
            document.getElementById("position").textContent =
                "not in a queue";

            document.getElementById("waitTime").textContent =
                "-";

            document.getElementById("serviceName").textContent =
                "";
        }

        // CARD 3: Display real backend notifications.
        function showNotificationSummary(notifications) {
            const unread = notifications.filter(
                n => !n.read
            ).length;

            document.getElementById(
                "notificationCount"
            ).textContent =
                `you have ${unread} unread notification` +
                (unread === 1 ? "" : "s");

            const box = document.getElementById(
                "notificationList"
            );

            box.replaceChildren();

            const recent = [...notifications]
                .reverse()
                .slice(0, 2);

            if (recent.length === 0) {
                box.textContent = "No notifications yet.";
                return;
            }

            for (const notification of recent) {
                const p = document.createElement("p");
                const small = document.createElement("small");

                small.textContent = notification.text;

                p.appendChild(small);
                box.appendChild(p);
            }
        }

        // Load all Dashboard information.
        async function refreshDashboard() {
            if (dashboardIsLoading) return;

            dashboardIsLoading = true;

            try {
                const [services, entries] = await Promise.all([
                    dashboardRequest("/services"),
                    dashboardRequest("/queue")
                ]);

                // Update services from the backend.
                showServicesFromBackend(services, entries);

                const myEntry = findCurrentEntry(entries);

                if (!myEntry) {
                    localStorage.removeItem(
                        "queuesmart_activeEntryId"
                    );

                    showNoQueue();
                    showNotificationSummary([]);
                    return;
                }

                localStorage.setItem(
                    "queuesmart_activeEntryId",
                    String(myEntry.id)
                );

                const service = services.find(item =>
                    Number(item.id) ===
                    Number(myEntry.serviceId)
                );

                document.getElementById(
                    "serviceName"
                ).textContent =
                    (service ? service.name : "Unknown service") +
                    " (waiting)";

                // Fetch Module 4 and Module 5 backend results.
                const [waitResult, notificationResult] =
                    await Promise.allSettled([
                        dashboardRequest(
                            `/queue/${myEntry.id}/wait-time`
                        ),
                        dashboardRequest(
                            `/queue/${myEntry.id}/notifications`
                        )
                    ]);

                // Module 4: Estimated waiting time.
                if (waitResult.status === "fulfilled") {
                    const wait = waitResult.value;

                    document.getElementById(
                        "position"
                    ).textContent = wait.position;

                    document.getElementById(
                        "waitTime"
                    ).textContent =
                        wait.estimatedWaitMinutes + " minutes";
                } else {
                    document.getElementById(
                        "position"
                    ).textContent = "-";

                    document.getElementById(
                        "waitTime"
                    ).textContent = "Unavailable";

                    console.error(
                        "Wait-time API:",
                        waitResult.reason
                    );
                }

                // Module 5: Notification Summary.
                if (notificationResult.status === "fulfilled") {
                    showNotificationSummary(
                        notificationResult.value.notifications || []
                    );
                } else {
                    document.getElementById(
                        "notificationCount"
                    ).textContent = "Notifications unavailable";

                    document.getElementById(
                        "notificationList"
                    ).textContent = "Check the backend connection.";

                    console.error(
                        "Notification API:",
                        notificationResult.reason
                    );
                }

            } catch (error) {
                console.error("Dashboard error:", error);

                document.getElementById(
                    "position"
                ).textContent = "-";

                document.getElementById(
                    "waitTime"
                ).textContent = "Unavailable";

                document.getElementById(
                    "serviceName"
                ).textContent = "Could not load queue data.";

                document.getElementById(
                    "serviceList"
                ).textContent = "Could not load services.";

                document.getElementById(
                    "notificationCount"
                ).textContent = "Notifications unavailable";

                document.getElementById(
                    "notificationList"
                ).textContent = "Check the backend connection.";

            } finally {
                dashboardIsLoading = false;
            }
        }

        // Load once, then refresh every 10 seconds.
        refreshDashboard();
        setInterval(refreshDashboard, 10000);
    </script>
</body>
</html>
