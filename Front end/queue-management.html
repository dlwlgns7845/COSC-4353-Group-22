<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Management - QueueSmart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar" id="navbar"></div>

  <div class="page">
    <h1>Queue management</h1>
    <p class="subtitle">Pick a service, then move people up or down, remove them, or serve the next one.</p>

    <div class="card">
      <div class="field">
        <label for="service">Service</label>
        <select id="service"></select>
      </div>

      <div class="card-row">
        <div class="card">
          <div class="hint">People waiting</div>
          <div class="big-number" id="waitingCount">0</div>
        </div>
        <div class="card">
          <div class="hint">Average wait</div>
          <div class="big-number" id="averageWait">0 min</div>
        </div>
        <div class="card">
          <div class="hint">Next in line</div>
          <div class="big-number" id="nextPerson">-</div>
        </div>
      </div>

      <button id="serveButton">Serve next user</button>
    </div>

    <div class="card">
      <h2>Queue</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="queueRows"></tbody>
      </table>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="nav.js"></script>
  
<script>
  renderNav("queues", "admin");

  const API_URL = "http://localhost:3000/api";

  const STATUS_TEXT = {
    "waiting": "Waiting",
    "almost-ready": "Almost ready",
    "served": "Served"
  };

  let services = [];
  let queues = [];
  let queue = [];
  let currentQueueId = null;

  // Read the requested service ID from the page URL.
  function getServiceIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return Number(params.get("service"));
  }

  // Send an HTTP request to the backend.
  async function apiRequest(path, options = {}) {
    const response = await fetch(API_URL + path, {
      headers: {
        "Content-Type": "application/json"
      },
      ...options
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || "Request failed.");
    }

    return data;
  }

  // Load services from the backend.
  async function loadServices() {
    services = await apiRequest("/services");

    const select = document.getElementById("service");
    const wanted = getServiceIdFromUrl();

    select.innerHTML = "";

    services.forEach(function (service) {
      const option = document.createElement("option");
      option.value = service.id;
      option.textContent = service.name;
      select.appendChild(option);
    });

    if (services.some(function (s) {
      return s.id === wanted;
    })) {
      select.value = wanted;
    }
  }

  function selectedServiceId() {
    return Number(document.getElementById("service").value);
  }

  function findSelectedService() {
    return services.find(function (service) {
      return service.id === selectedServiceId();
    });
  }

  async function loadQueue() {
    const serviceId = selectedServiceId();

    if (!serviceId) {
        queues = [];
        queue = [];
        currentQueueId = null;
        showQueue();
        return;
    }

    // Get all queues.
    queues = await apiRequest("/queues");

    // Find the queue for the selected service.
    const selectedQueue = queues.find(function (item) {
        return Number(item.serviceId) === serviceId;
    });

    if (!selectedQueue) {
        queue = [];
        currentQueueId = null;
        showQueue();
        return;
    }

    // Get the queue ID.
    currentQueueId = selectedQueue.queueId;

    // Get people waiting in that queue.
    queue = await apiRequest(
        "/queues/" + currentQueueId + "/entries"
    );

    showQueue();
}

  // Draw the queue and summary numbers.
  function showQueue() {
    const line = queue.filter(function (entry) {
    return entry.status === "waiting";
  });
    const service = findSelectedService();

    document.getElementById("waitingCount").textContent = line.length;

    document.getElementById("averageWait").textContent =
      (line.length === 0 || !service
        ? 0
        : Math.round(line.length * service.duration / 2)) + " min";

    document.getElementById("nextPerson").textContent =
      line.length === 0 ? "-" : "User " + line[0].userId;

    const rows = document.getElementById("queueRows");
    rows.innerHTML = "";

    if (line.length === 0) {
      rows.innerHTML =
        '<tr><td colspan="5" class="empty">' +
        'Nobody is waiting for this service.</td></tr>';
      return;
    }

    line.forEach(function (entry, index) {
      const row = document.createElement("tr");

      const joined = new Date(entry.joinTime);
      const joinedText = Number.isNaN(joined.getTime())
        ? entry.joinTime
        : joined.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
          });

      row.innerHTML =
        "<td>" + (index + 1) + "</td>" +
        "<td></td>" +
        "<td></td>" +
        "<td></td>" +
        "<td></td>";

      row.children[1].textContent = entry.userName;
      row.children[2].textContent = joinedText;

      const badge = document.createElement("span");
      badge.className = "badge " + entry.status;
      badge.textContent = STATUS_TEXT[entry.status] || entry.status;
      row.children[3].appendChild(badge);

      const removeButton = document.createElement("button");
      removeButton.className = "small red";
      removeButton.textContent = "Remove";
      removeButton.addEventListener("click", function () {
        removeUser(entry.entryId);
      });

      row.children[4].appendChild(removeButton);
      rows.appendChild(row);
    });
  }

  // Remove an entry through the backend.
async function removeUser(entryId) {

    const entry = queue.find(function (item) {
        return item.entryId === entryId;
    });

    if (!entry) return;

    if (!confirm("Remove user ID " + entry.userId + " from this queue?")) {
        return;
    }

    try {
        await apiRequest(
            "/queues/" + currentQueueId + "/entries/" + entryId,
            {
                method: "DELETE"
            }
        );

        addNotification(
            "User ID " + entry.userId + " was removed from the queue.",
            "queue",
            "Removed from queue"
        );

        await loadQueue();

    } catch (error) {
        alert("Could not remove user: " + error.message);
    }
}

  document.getElementById("serveButton").addEventListener(
  "click",
  async function () {
    const service = findSelectedService();

    if (!currentQueueId) {
      alert("There is no queue for this service.");
      return;
    }

    const line = queue.filter(function (entry) {
      return entry.status === "waiting";
    });

    if (line.length === 0) {
      alert("Nobody is waiting for this service.");
      return;
    }

    try {
      const result = await apiRequest(
        "/queues/" + currentQueueId + "/serve",
        {
          method: "POST"
        }
      );

      const servedPerson = result.servedEntry;

      // Keep the existing local history feature.
      const history = getHistory();

      history.unshift({
        id: Date.now(),
        date: new Date().toISOString().slice(0, 10),
        serviceName: service.name,
        waitMinutes: service.duration,
        outcome: "Served"
      });

      setHistory(history);

      addNotification(
        "User " + servedPerson.userId + " was served at " +
        service.name + ".",
        "status",
        "Served"
      );

      alert("User " + servedPerson.userId + " was served!");

      await loadQueue();

    } catch (error) {
      alert("Could not serve next user: " + error.message);
    }
  }
);

  document.getElementById("service").addEventListener(
    "change",
    function () {
      loadQueue().catch(function (error) {
        alert("Could not load queue: " + error.message);
      });
    }
  );

  // Start the page.
  async function initializePage() {
    try {
      await loadServices();
      await loadQueue();
    } catch (error) {
      alert(
        "Could not connect to QueueSmart. Make sure the backend is running. " +
        error.message
      );
    }
  }

  initializePage();
</script>


</body>
</html>
