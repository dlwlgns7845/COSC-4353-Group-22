<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - QueueSmart</title>

    <!-- Keep teammate's original styling -->
    <link rel="stylesheet" href="register.css">

    <!-- Your validation styling -->
    <link rel="stylesheet" href="validation.css">
</head>

<body>

    <div class="register-card">

        <h1>Register</h1>

        <form
            id="registerForm"
            novalidate
        >

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                    data-label="Email"
                >

                <small
                    class="validation-message"
                    id="emailError"
                ></small>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    data-label="Password"
                >

                <small
                    class="validation-message"
                    id="passwordError"
                ></small>

            </div>


            <button
                class="register-button"
                type="submit"
            >
                Register
            </button>


            <div
                class="form-success"
                id="formSuccess"
                role="status"
            ></div>

        </form>

    </div>


    <script src="validation.js"></script>

</body>

</html>
