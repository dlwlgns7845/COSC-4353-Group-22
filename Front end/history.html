<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "stylesheet" href = "user_style.css">
    </head>

    <body>
        <div class="navbar" id="navbar"></div>

        <h1>My History</h1>

        <div class = "container">
            <div class = "card wide">
                <h2>Filter by date</h2>

                <div class="card-row">
                    <div class="field" style="flex:1">
                        <label for="fromDate">From date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="field" style="flex:1">
                        <label for="toDate">To date</label>
                        <input type="date" id="toDate">
                    </div>
                </div>

                <p class="error" id="dateError">The from date must not be after the to date.</p>

                <div>
                    <button id="applyButton">Apply filter</button>
                    <button class="gray" id="clearButton">Clear</button>
                </div>
            </div>
        </div>

        <div class = "container">
            <div class = "card wide">
                <h2>Past Queues Joined</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Service Name</th>
                            <th>Wait time</th>
                            <th>Outcome</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="nav.js"></script>
        <script>
    renderNav("history", "user");

    let allHistory = [];

    // Display history records in the table.
    function showHistory(rows) {
        let html = "";

        if (rows.length === 0) {
            html = '<tr><td colspan="4" class="empty">No records found.</td></tr>';
        }

        rows.forEach(function (row) {
            html += "<tr>" +
                "<td>" + row.date + "</td>" +
                "<td>" + row.serviceName + "</td>" +
                "<td>" + row.waitMinutes + " min</td>" +
                "<td>" + row.outcome + "</td>" +
                "</tr>";
        });

        document.getElementById("historyRows").innerHTML = html;
    }

    // Load history records from the backend.
    async function loadHistory() {
        try {
            const response = await fetch(
                "http://localhost:3000/api/history/" +
                encodeURIComponent(CURRENT_USER.email)
            );

            if (!response.ok) {
                throw new Error("Could not load history");
            }

            const data = await response.json();

            allHistory = data.history.map(function (record) {
                return {
                    date: String(record.completedAt).slice(0, 10),
                    serviceName: record.serviceName,
                    waitMinutes: record.waitMinutes,
                    outcome: record.outcome
                };
            });

            showHistory(allHistory);

        } catch (error) {
            console.error(error);

            document.getElementById("historyRows").innerHTML =
                '<tr><td colspan="4">Could not load history.</td></tr>';
        }
    }

    // Apply the date filter.
    document.getElementById("applyButton").addEventListener("click", function () {
        const from = document.getElementById("fromDate").value;
        const to = document.getElementById("toDate").value;
        const error = document.getElementById("dateError");

        if (from && to && from > to) {
            error.style.display = "block";
            return;
        }

        error.style.display = "none";

        const filtered = allHistory.filter(function (row) {
            if (from && row.date < from) return false;
            if (to && row.date > to) return false;
            return true;
        });

        showHistory(filtered);
    });

    // Clear the date filter.
    document.getElementById("clearButton").addEventListener("click", function () {
        document.getElementById("fromDate").value = "";
        document.getElementById("toDate").value = "";
        document.getElementById("dateError").style.display = "none";

        showHistory(allHistory);
    });

    // Load the records when the page opens.
    loadHistory();
</script>
    </body>
</html>
