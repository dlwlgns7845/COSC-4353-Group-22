<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History</title>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "stylesheet" href = "user_style.css">
    </head>

    <body>
        <div class="navbar" id="navbar"></div>

        <h1>My History</h1>

        <div class = "container">
            <div class = "card wide">
                <h2>Filter by date</h2>

                <div class="card-row">
                    <div class="field" style="flex:1">
                        <label for="fromDate">From date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="field" style="flex:1">
                        <label for="toDate">To date</label>
                        <input type="date" id="toDate">
                    </div>
                </div>

                <p class="error" id="dateError">The from date must not be after the to date.</p>

                <div>
                    <button id="applyButton">Apply filter</button>
                    <button class="gray" id="clearButton">Clear</button>
                </div>
            </div>
        </div>

        <div class = "container">
            <div class = "card wide">
                <h2>Past Queues Joined</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Service Name</th>
                            <th>Wait time</th>
                            <th>Outcome</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>
        </div>

        <script src="data.js"></script>
        <script src="nav.js"></script>
        <script>
            renderNav("history", "user");

            const API_BASE = "http://localhost:3000";

            /* Ask the backend for data. Same helper the other screens use. */
            async function apiRequest(path) {
                const response = await fetch(API_BASE + path, { cache: "no-store" });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(
                        data.error || `Request failed (${response.status})`
                    );
                }

                return data;
            }

            /* Draw the table from whatever the backend sent back. */
            function showHistory(rows) {
                let html = "";

                if (rows.length === 0) {
                    html = '<tr><td colspan="4" class="empty">No records found.</td></tr>';
                }

                rows.forEach(function (row) {
                    html += "<tr>" +
                              "<td>" + row.completedAt + "</td>" +
                              "<td>" + row.serviceName + "</td>" +
                              "<td>" + row.waitMinutes + " min</td>" +
                              "<td>" + row.outcome + "</td>" +
                            "</tr>";
                });

                document.getElementById("historyRows").innerHTML = html;
            }

            function showMessage(text) {
                document.getElementById("historyRows").innerHTML =
                    '<tr><td colspan="4" class="empty">' + text + "</td></tr>";
            }

            /* Load the history for the logged in user.
               The dates are optional and go to the backend as a query. */
            async function loadHistory(fromDate, toDate) {
                const userId = encodeURIComponent(CURRENT_USER.email);

                let path = "/api/history/" + userId;
                const parts = [];

                if (fromDate) { parts.push("from=" + fromDate); }
                if (toDate) { parts.push("to=" + toDate); }

                if (parts.length > 0) {
                    path = path + "?" + parts.join("&");
                }

                try {
                    const data = await apiRequest(path);
                    showHistory(data.history);
                } catch (error) {
                    showMessage("Could not load your history. Is the server running?");
                }
            }

            document.getElementById("applyButton").addEventListener("click", function () {
                const from = document.getElementById("fromDate").value;
                const to = document.getElementById("toDate").value;
                const error = document.getElementById("dateError");

                /* validation: when both dates are filled, from must come first */
                if (from && to && from > to) {
                    error.style.display = "block";
                    return;
                }

                error.style.display = "none";
                loadHistory(from, to);
            });

            document.getElementById("clearButton").addEventListener("click", function () {
                document.getElementById("fromDate").value = "";
                document.getElementById("toDate").value = "";
                document.getElementById("dateError").style.display = "none";
                loadHistory();
            });

            loadHistory();
        </script>
    </body>
</html>
