<!-- Part 4 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QueueSmart - Notifications</title>

    <link
        rel="stylesheet"
        href="notifications.css"
    >
</head>

<body>

    <!-- =========================
         NAVIGATION BAR
    ========================== -->

    <header class="navbar">

        <a href="#" class="logo">
            <span class="logo-icon">Q</span>
            <span>QueueSmart</span>
        </a>


        <div class="notification-wrapper">

            <!-- Notification Bell -->

            <button
                class="notification-button"
                id="notificationButton"
                aria-label="Open notifications"
                aria-expanded="false"
                aria-controls="notificationPanel"
            >

                <svg
                    class="bell-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>
                </svg>


                <span
                    class="notification-badge"
                    id="notificationBadge"
                    aria-live="polite"
                >
                    0
                </span>

            </button>


            <!-- Notification Dropdown -->

            <section
                class="notification-panel"
                id="notificationPanel"
                aria-label="Notifications"
            >

                <div class="notification-header">

                    <div class="notification-heading">

                        <h2>Notifications</h2>

                        <p id="unreadText">
                            Loading notifications...
                        </p>

                    </div>


                    <button
                        class="mark-read-button"
                        id="markAllRead"
                        type="button"
                    >
                        Mark all as read
                    </button>

                </div>


                <!-- Notifications generated by JavaScript -->

                <div
                    class="notification-list"
                    id="notificationList"
                >
                </div>

            </section>

        </div>

    </header>


    <!-- =========================
         DEMO PAGE CONTENT
    ========================== -->

    <main class="page-content">

        <div class="page-card">

            <div class="page-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path
                        d="M10 21h4"
                    ></path>
                </svg>

            </div>


            <h1>QueueSmart Notifications</h1>

            <p>
                Stay informed about changes to your queue position
                and service status.
            </p>


            <div class="demo-note">

                <span class="demo-dot"></span>

                <span>
                    Select the notification bell in the top-right
                    corner to view updates.
                </span>

            </div>

        </div>

    </main>


    <script src="notifications.js"></script>

</body>

</html>
