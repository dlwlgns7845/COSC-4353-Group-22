<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - QueueSmart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar" id="navbar"></div>

  <div class="page">
    <h1>Admin dashboard</h1>
    <p class="subtitle">All services, how many people are waiting, and quick actions.</p>

    <!-- three summary numbers at the top -->
    <div class="card-row">
      <div class="card">
        <div class="hint">Services</div>
        <div class="big-number" id="serviceCount">0</div>
      </div>
      <div class="card">
        <div class="hint">People waiting</div>
        <div class="big-number" id="waitingCount">0</div>
      </div>
      <div class="card">
        <div class="hint">Longest queue</div>
        <div class="big-number" id="longestQueue">-</div>
      </div>
    </div>

    <div class="card">
      <h2>Services</h2>
      <table>
        <thead>
          <tr>
            <th>Service</th>
            <th>Priority</th>
            <th>Duration</th>
            <th>Queue length</th>
            <th>Quick actions</th>
          </tr>
        </thead>
        <tbody id="serviceRows"></tbody>
      </table>
      <p class="error" id="loadError">Could not reach the server. Start it with npm start.</p>
      <a class="button" href="service-management.html">Add a new service</a>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="nav.js"></script>
  <script>
    renderNav("admin", "admin");

    const API_BASE = "http://localhost:3000";

    /* Ask the backend for data. Same helper the other screens use. */
    async function apiRequest(path, options = {}) {
      const response = await fetch(API_BASE + path, options);

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || `Request failed (${response.status})`);
      }

      return data;
    }

    /* Count how many people are waiting for one service. */
    function countWaiting(queue, serviceId) {
      return queue.filter(function (entry) {
        return entry.serviceId === serviceId;
      }).length;
    }

    /* --- the three numbers at the top --- */
    function showSummary(services, queue) {
      let longestCount = 0;

      services.forEach(function (service) {
        const count = countWaiting(queue, service.id);
        if (count > longestCount) {
          longestCount = count;
        }
      });

      document.getElementById("serviceCount").textContent = services.length;
      document.getElementById("waitingCount").textContent = queue.length;
      document.getElementById("longestQueue").textContent =
        (longestCount === 0) ? "-" : longestCount;
    }

    /* --- the service table --- */
    function showServices(services, queue) {
      let html = "";

      if (services.length === 0) {
        html = '<tr><td colspan="5" class="empty">No services yet.</td></tr>';
      }

      services.forEach(function (service) {
        const queueLength = countWaiting(queue, service.id);

        html += '<tr>' +
                  '<td>' + service.name + '</td>' +
                  '<td><span class="badge ' + service.priority + '">' + service.priority + '</span></td>' +
                  '<td>' + service.duration + ' min</td>' +
                  '<td>' + queueLength + '</td>' +
                  '<td>' +
                    '<button class="small gray" onclick="serveNext(' + service.id + ')">Serve next</button> ' +
                    '<a class="button small" href="queue-management.html?service=' + service.id + '">View queue</a>' +
                  '</td>' +
                '</tr>';
      });

      document.getElementById("serviceRows").innerHTML = html;
    }

    /* --- quick action: serve the next person in one queue --- */
    async function serveNext(serviceId) {
      try {
        const result = await apiRequest("/api/queue/serve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ serviceId: serviceId })
        });

        alert(result.entry.userName + " was served.");
        loadDashboard();
      } catch (error) {
        alert(error.message);
      }
    }

    /* --- load everything from the backend --- */
    async function loadDashboard() {
      try {
        const services = await apiRequest("/api/services");
        const queue = await apiRequest("/api/queue");

        document.getElementById("loadError").style.display = "none";

        showSummary(services, queue);
        showServices(services, queue);
      } catch (error) {
        document.getElementById("loadError").style.display = "block";
        document.getElementById("serviceRows").innerHTML =
          '<tr><td colspan="5" class="empty">No data.</td></tr>';
      }
    }

    loadDashboard();
  </script>

</body>
</html>
