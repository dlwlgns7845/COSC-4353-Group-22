<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Management - QueueSmart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="validation.css">
</head>
<body>

  <div class="navbar" id="navbar"></div>

  <div class="page">
    <h1>Service management</h1>
    <p class="subtitle">Create a new service, or edit one that already exists.</p>

    <!-- ========= the form =========
         All of the required validations live here:
         name is required and max 100 characters,
         description is required,
         duration is a number and required,
         priority is low / medium / high.
    -->
    <div class="card">
      <h2 id="formTitle">Create a service</h2>

      <!-- novalidate turns off the browser pop-up so we can show our own messages -->
      <form id="serviceForm" novalidate>

        <input type="hidden" id="serviceId" value="">

        <div class="field">
          <label for="name">Service name *</label>
          <input type="text" id="name" required maxlength="100"
                 data-label="Service name" placeholder="Ex: Financial Aid">
          <p class="hint"><span id="nameCount">0</span> / 100 characters</p>
          <small class="validation-message" id="nameError"></small>
        </div>

        <div class="field">
          <label for="description">Description *</label>
          <textarea id="description" rows="3" required maxlength="300"
                    data-label="Description"
                    placeholder="What does this service help with?"></textarea>
          <small class="validation-message" id="descriptionError"></small>
        </div>

        <div class="card-row">
          <div class="field" style="flex:1">
            <label for="duration">Expected duration (minutes) *</label>
            <input type="number" id="duration" required min="1" max="240"
                   data-label="Expected duration" placeholder="Ex: 15">
            <small class="validation-message" id="durationError"></small>
          </div>

          <div class="field" style="flex:1">
            <label for="priority">Priority level *</label>
            <select id="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <button type="submit" id="submitButton">Create service</button>
        <button type="button" class="gray" id="cancelButton" onclick="resetForm()" style="display:none">Cancel</button>
      </form>
    </div>

    <!-- ========= the list of services ========= -->
    <div class="card">
      <h2>All services</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Duration</th>
            <th>Priority</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="serviceRows"></tbody>
      </table>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="nav.js"></script>
  <script src="validation.js"></script>
  <script>
    renderNav("services", "admin");

    /* =======================================================
       VALIDATION
       The rules live in the HTML attributes of each field
       (required, maxlength, min, max). validateForm comes from
       validation.js, so the whole app checks forms the same way.
       ======================================================= */

    /* =======================================================
       SAVE - create a new service, or update an existing one
       ======================================================= */

       let servicesCache = [];

    
document.getElementById("serviceForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!validateForm(this)) {
        return;
    }

    const editingId = document.getElementById("serviceId").value;

    const values = {
        name: document.getElementById("name").value.trim(),
        description: document.getElementById("description").value.trim(),
        duration: Number(document.getElementById("duration").value),
        priority: document.getElementById("priority").value
    };

    try {
        let response;

        if (editingId === "") {
            // Send a new service to the backend
            response = await fetch("http://localhost:3000/api/services", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(values)
            });
        } else {
            // Send changes to the backend
            response = await fetch(
                "http://localhost:3000/api/services/" + editingId,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(values)
                }
            );
        }

        if (!response.ok) {
            throw new Error("Could not save service");
        }

        const savedService = await response.json();

        if (editingId === "") {
            addNotification(
                "New service " + savedService.name + " was created.",
                "status",
                "Service created"
            );
        } else {
            addNotification(
                "Service " + savedService.name + " was updated.",
                "status",
                "Service updated"
            );
        }

        resetForm();
        await showServices();

    } catch (error) {
        console.error("Error saving service:", error);
        alert("Could not save the service. Make sure the backend is running.");
    }
});


    /* =======================================================
       EDIT and DELETE
       ======================================================= */
    
function editService(serviceId) {
    const service = servicesCache.find(function (item) {
        return item.id === Number(serviceId);
    });

    if (!service) {
        alert("Service not found. Please refresh the page.");
        return;
    }

    document.getElementById("serviceId").value = service.id;
    document.getElementById("name").value = service.name;
    document.getElementById("description").value = service.description;
    document.getElementById("duration").value = service.duration;
    document.getElementById("priority").value = service.priority;

    document.getElementById("formTitle").textContent = "Edit service";
    document.getElementById("submitButton").textContent = "Save changes";
    document.getElementById("cancelButton").style.display = "inline-block";

    updateNameCount();
    window.scrollTo(0, 0);
}


    
async function deleteService(serviceId) {
    const service = servicesCache.find(function (item) {
        return item.id === Number(serviceId);
    });

    if (!service) {
        alert("Service not found.");
        return;
    }

    if (!confirm("Delete " + service.name + "? People waiting for it will be removed too.")) {
        return;
    }

    try {
        const response = await fetch(
            "http://localhost:3000/api/services/" + serviceId,
            {
                method: "DELETE"
            }
        );

        if (!response.ok) {
            throw new Error("Could not delete service");
        }

      

        addNotification(
            "Service " + service.name + " was deleted.",
            "status",
            "Service deleted"
        );

        resetForm();
        await showServices();

    } catch (error) {
        console.error("Error deleting service:", error);
        alert("Could not delete service. Check the backend.");
    }
}


    /* put the form back into create mode */
    function resetForm() {
      document.getElementById("serviceForm").reset();
      document.getElementById("serviceId").value = "";
      document.getElementById("formTitle").textContent = "Create a service";
      document.getElementById("submitButton").textContent = "Create service";
      document.getElementById("cancelButton").style.display = "none";

      /* clear any messages left over from the last attempt */
      document.querySelectorAll(".validation-message").forEach(function (box) {
        box.textContent = "";
      });
      document.querySelectorAll(".input-error").forEach(function (field) {
        field.classList.remove("input-error");
      });

      updateNameCount();
    }

    /* =======================================================
       THE TABLE
       ======================================================= */

    async function showServices() {
  try {
    const response = await fetch("http://localhost:3000/api/services");

    if (!response.ok) {
      throw new Error("Could not load services");
    }

    servicesCache = await response.json();

    let html = "";

    servicesCache.forEach(function (service) {
      html += "<tr>" +
                "<td>" + service.name + "</td>" +
                "<td>" + service.description + "</td>" +
                "<td>" + service.duration + " min</td>" +
                '<td><span class="badge ' + service.priority + '">' + service.priority + "</span></td>" +
                "<td>" +
                  '<button class="small gray" onclick="editService(' + service.id + ')">Edit</button> ' +
                  '<button class="small red" onclick="deleteService(' + service.id + ')">Delete</button>' +
                "</td>" +
              "</tr>";
    });

    document.getElementById("serviceRows").innerHTML = html;
  } catch (error) {
    console.error("Error loading services:", error);
    document.getElementById("serviceRows").innerHTML =
      '<tr><td colspan="5">Could not load services. Check that the backend is running.</td></tr>';
  }
}

    /* live character counter under the name field */
    function updateNameCount() {
      document.getElementById("nameCount").textContent =
        document.getElementById("name").value.length;
    }

    document.getElementById("name").addEventListener("input", updateNameCount);

    showServices();
  </script>

</body>
</html>
